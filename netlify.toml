[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ============================================
# PROXY PARA VERIFICADOR (SITIO SECUNDARIO)
# ============================================

[[redirects]]
  from = "/verificador"
  to = "https://cronobot-certify.netlify.app/verificador"
  status = 200
  force = true

[[redirects]]
  from = "/verificador/*"
  to = "https://cronobot-certify.netlify.app/verificador/:splat"
  status = 200
  force = true

# ============================================
# PROXY PARA LOGIN
# ============================================

[[redirects]]
  from = "/loginC"
  to = "https://cronobot-certify.netlify.app/login"
  status = 200
  force = true

# ============================================
# PROXY PARA DASHBOARD (RUTAS ESPECÍFICAS PRIMERO)
# ============================================

# 👇 IMPORTANTE: Las rutas más específicas van PRIMERO
[[redirects]]
  from = "/dashboard/certificados"
  to = "https://cronobot-certify.netlify.app/dashboard/certificados"
  status = 200
  force = true

[[redirects]]
  from = "/dashboard/certificados/*"
  to = "https://cronobot-certify.netlify.app/dashboard/certificados/:splat"
  status = 200
  force = true

# 👇 Esta regla captura TODO lo demás en /dashboard
[[redirects]]
  from = "/dashboard"
  to = "https://cronobot-certify.netlify.app/dashboard"
  status = 200
  force = true

[[redirects]]
  from = "/dashboard/*"
  to = "https://cronobot-certify.netlify.app/dashboard/:splat"
  status = 200
  force = true